; dilamp — конфигурация сборки
; Рабочая среда: VS Code + PlatformIO IDE Extension
; Правила проекта — AGENTS.md §6.1 (инструменты не дублировать)
;
; Два окружения — две аппаратные платы. Автотестов нет: проверка ведётся
; глазами на железе, а сборка проверяется сразу под обе платы.

[platformio]
default_envs = nano

; ---------- Arduino Nano (ATmega328P, 16 МГц) — основная ----------
[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
build_flags = -D DILAMP_ADC_BITS=10

; ---------- Китайский аналог LGT8F328P (заготовка, не проверяется) ----------
; F_CPU обязан остаться в 15.4-19 МГц: иначе Adafruit_NeoPixel
; не собирается (#error "CPU SPEED NOT SUPPORTED").
; 16 МГц — заводская конфигурация чипа; 32 МГц требует пережигания fuse.
[env:lgt]
platform = lgt8f
board = LGT8F328P
framework = arduino
board_build.f_cpu = 16000000
monitor_speed = 115200
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
build_flags = -D DILAMP_ADC_BITS=12
